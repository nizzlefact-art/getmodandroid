{% extends 'admin/base.html' %}{% block title %}Categories{% endblock %}{% block body %}
<form method="post" class="form" style="max-width:none"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="action" value="save"><input type="hidden" name="id" value="{{ e.id or 0 }}">
<div class="fgrid"><div><label>Name</label><input name="name" required value="{{ e.name or '' }}"></div><div><label>Type</label><select name="type"><option value="app">App category</option><option value="game" {{ 'selected' if e.type=='game' }}>Game category</option></select></div>
<div><label>Slug (optional)</label><input name="slug" value="{{ e.slug or '' }}"></div><div><label>Description / meta</label><input name="description" value="{{ e.description or '' }}"></div></div>
<div><button class="btn">{{ 'Update' if e.id else 'Add' }} category</button> {% if e.id %}<a href="{{ url_for('admin.categories') }}">Cancel</a>{% endif %}</div></form>
<div class="tablewrap"><table><tr><th>Name</th><th>Type</th><th>URL</th><th>Items</th><th></th></tr>{% for c in rows %}<tr><td>{{ c.name }}</td><td>{{ c.type }}</td><td>/category/{{ c.slug }}/</td><td>{{ c.n }}</td>
<td><a href="{{ url_for('admin.categories',edit=c.id) }}">Edit</a> <form method="post" class="inline" onsubmit="return confirm('Delete category?')"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ c.id }}"><button class="btn danger" style="padding:3px 10px">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
