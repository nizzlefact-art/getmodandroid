{% extends 'admin/base.html' %}{% block title %}Reviews{% endblock %}{% block body %}
<div class="tablewrap"><table><tr><th>App</th><th>Name</th><th>★</th><th>Comment</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.app }}</td><td>{{ r.name }}</td><td>{{ r.rating }}</td><td>{{ r.comment[:200] }}</td><td>{{ 'Approved' if r.is_approved else 'Pending' }}</td>
<td><form method="post" class="inline"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="id" value="{{ r.id }}"><button class="btn" name="action" value="{{ 'unapprove' if r.is_approved else 'approve' }}" style="padding:3px 10px">{{ 'Hide' if r.is_approved else 'Approve' }}</button> <button class="btn danger" name="action" value="delete" style="padding:3px 10px" onclick="return confirm('Delete review?')">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
