<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title><link rel="stylesheet" href="/static/css/style.css"></head><body>
<div class="verify"><h1>{{ 'Create admin account' if setup else 'Admin login' }}</h1>
{% for c,m in get_flashed_messages(with_categories=true) %}<p class="notice" {% if c=='err' %}style="border-color:#dc2626"{% endif %}>{{ m }}</p>{% endfor %}
<form method="post" class="form" style="margin:auto"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="email" name="email" placeholder="Email" required autofocus>
<input type="password" name="password" placeholder="Password{{ ' (10+ chars)' if setup }}" required {% if setup %}minlength="10"{% endif %}><button class="btn">{{ 'Create admin' if setup else 'Sign in' }}</button></form></div></body></html>
